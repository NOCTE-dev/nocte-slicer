<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="max-age=7200" />
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" name="viewport" />
<title>homepage</title>
<!-- The shared NOCTE tokens, then this page's own rules, then the dark overrides.
     ../include/globalapi.js adds and removes ./css/dark.css at runtime from the "dark"
     token in the user agent string, so that exact href must stay spelled this way. -->
<link rel="stylesheet" type="text/css" href="../include/global.css" />
<link rel="stylesheet" type="text/css" href="./css/home.css" />
<link rel="stylesheet" type="text/css" href="./css/dark.css" />

<script type="text/javascript" src="../include/jquery-2.1.1.min.js"></script>
<script type="text/javascript" src="../include/json2.js"></script>
<script type="text/javascript" src="../include/globalapi.js"></script>
<script type="text/javascript" src="../data/text.js"></script>

<script type="text/javascript" src="js/home.js"></script>
</head>
<body class="ZScrol" onLoad="OnInit()">

<div id="LeftBoard">
	<div id="BrandArea">
		<!-- Two variants rather than one recoloured asset: the theme is switched by adding or
		     removing css/dark.css, which cannot rewrite an <img> src. The light file is the
		     black mark for a light background, the dark file the white mark for a dark one. -->
		<img class="BrandWordmark BrandLight" src="../image/nocte_wordmark_light.svg" alt="N&#216;CTE" />
		<img class="BrandWordmark BrandDark" src="../image/nocte_wordmark_dark.svg" alt="N&#216;CTE" />
		<div id="BrandTagline">Building the Impossible</div>
	</div>

	<div id="BtnArea">
		<div menu="recent" class="BtnItem BtnItemSelected" onClick="GotoMenu('recent')">
			<span class="BtnIcon">
				<svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
					<circle cx="8" cy="8" r="6.25" stroke="currentColor" stroke-width="1.4"/>
					<path d="M8 4.5V8l2.5 1.75" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
				</svg>
			</span>
			<span class="trans" tid="t28">Recent</span>
		</div>
	</div>
</div>

<div id="RightBoard">
<div id="ContentBoard" class="ZScrol" board="recent">

	<div id="MenuArea">
		<div class="MenuItem" onClick="OnClickNewProject()">
			<span class="MenuIcon">
				<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
					<rect x="3.75" y="3.75" width="16.5" height="16.5" rx="2" stroke="currentColor" stroke-width="1.5"/>
					<path d="M12 8.25v7.5M8.25 12h7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
				</svg>
			</span>
			<span class="MenuText">
				<span class="TextS1 trans" tid="t31">New Project</span>
				<span class="MenuDesc trans" tid="t32">Create new project</span>
			</span>
		</div>
		<div class="MenuItem" onClick="OnClickOpenProject()">
			<span class="MenuIcon">
				<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
					<path d="M3.75 18.25V6.75a1.5 1.5 0 0 1 1.5-1.5h3.9l1.8 2.25h7.8a1.5 1.5 0 0 1 1.5 1.5v9.25a1.5 1.5 0 0 1-1.5 1.5H5.25a1.5 1.5 0 0 1-1.5-1.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
				</svg>
			</span>
			<span class="MenuText">
				<span class="TextS1 trans" tid="t33">Open Project</span>
				<span class="MenuDesc">3mf</span>
			</span>
		</div>
	</div>

	<div id="RecentFileArea">
		<div id="RecentTitleBlock">
			<div id="RecentTitle" class="Content-Title TextS1 trans" tid="t35">Recently opened</div>
			<div id="RecentClearAllBtn" class="ButtonStyleRegular ButtonTypeWindow trans" tid="t12" onClick="OnDeleteAllRecentFiles()">Clear all</div>
		</div>
		<div id="FileList"></div>
		<div id="EmptyState" class="trans" tid="nocte1">No recent projects yet</div>
	</div>

	<div id="recnet_context_menu">
		<div id="CT_Delete_Bar" class="CT_Item" onClick="OnDeleteRecentFile()">
			<span class="CT_Icon">
				<svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
					<path d="M2.75 4.25h10.5M6.5 4.25V2.75h3v1.5M4.25 4.25l.6 8.5a1 1 0 0 0 1 .95h4.3a1 1 0 0 0 1-.95l.6-8.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
				</svg>
			</span>
			<span class="CT_Text trans" tid="t88">Remove</span>
		</div>
		<div id="CT_Folder_Bar" class="CT_Item" onClick="OnExploreRecentFile()">
			<span class="CT_Icon">
				<svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
					<path d="M2 12.25V4.25a1 1 0 0 1 1-1h2.6l1.2 1.5H13a1 1 0 0 1 1 1v6.5a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
				</svg>
			</span>
			<span class="CT_Text trans" tid="t89">Open Containing Folder</span>
		</div>
	</div>

</div>
</div>

</body>
<script type="text/javascript">
	document.onkeydown = function (event) {
		var e = event || window.event || arguments.callee.caller.arguments[0];

		if (e.ctrlKey && e.metaKey)
			OutputKey(e.keyCode, true, false, true);
		else if (e.ctrlKey)
			OutputKey(e.keyCode, true, false, false);
		else if (e.metaKey)
			OutputKey(e.keyCode, false, false, true);

		if (e.shiftKey && e.ctrlKey)
			OutputKey(e.keyCode, true, true, false);

		if (e.shiftKey && e.metaKey)
			OutputKey(e.keyCode, false, true, true);

		if (window.event) {
			try { e.keyCode = 0; } catch (e) { }
			e.returnValue = false;
		}
	};

	window.addEventListener('mousewheel', function (event) {
		if (event.ctrlKey === true || event.metaKey) {
			event.preventDefault();
		}
	}, { passive: false });
</script>
</html>
