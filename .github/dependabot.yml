version: 2
updates:
  # Only care about major updates to github actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore: # Only suggest major updates for built-in actions
      - dependency-name: "github/*"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]
      - dependency-name: "actions/*"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]
  # NOCTE: upstream's "docker" ecosystem entry is dropped on the fork. There is no
  # Dockerfile at the repository root, so every run failed with
  # "No Dockerfiles nor Kubernetes YAML found in /".
  # no support for c/cpp
